<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM</title>
  </head>
  <body style="background-color: #212121; color: #fff">
    <ui class="language">
      <li>JavaScript</li>
    </ui>
  </body>
  <script>
    function addLang(langName) {
      const li = document.createElement("li");
      li.innerHTML = `${langName}`;
      document.querySelector(".language").appendChild(li);
    }
    addLang("java");
    addLang("typeScript");

    function addLang(langName) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(langName));
      document.querySelector(".language").appendChild(li);
    }
    addLang("java17 ");

    //edit
    const newli = document.querySelector("li:nth-child(2)");
    const replaseLi = document.createElement("li");
    replaseLi.appendChild(document.createTextNode("Mojo"));
    console.log(replaseLi);
    newli.replaceWith(replaseLi);

    //last
    const lastli = document.querySelector("li:last-child");
    lastli.remove();
  </script>
</html>
